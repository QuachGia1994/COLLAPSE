name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build beta APKs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check localization keys
        run: python3 scripts/check_localization.py

      - name: Verify Android background music asset
        run: |
          test -s android/app/src/main/res/raw/collapse_arcade_vibe.mp3 || { echo "Background music asset missing or empty"; exit 1; }
          grep -q "uncle-sheepsky/duru-cc0-bgm" docs/audio.md || { echo "Background music provenance missing"; exit 1; }
          grep -q "CC0 1.0" docs/audio.md || { echo "Background music license missing"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test and build beta APKs
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Enforce Android unsigned beta size target
        run: |
          size="$(stat -c%s android/app/build/outputs/apk/release/app-release-unsigned.apk)"
          limit="$((25 * 1024 * 1024))"
          echo "Unsigned APK bytes: $size"
          [[ "$size" -lt "$limit" ]] || { echo "Unsigned APK exceeds 25 MB target"; exit 1; }

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: COLLAPSE-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: COLLAPSE-Android-Unsigned-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
