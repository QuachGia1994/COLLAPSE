name: Collapse
options:
  bundleIdPrefix: com.collapse
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  Collapse:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - path: Resources
        buildPhase: resources
        excludes:
          - Collapse.entitlements
    dependencies:
      - target: CollapseWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.collapse.game
        PRODUCT_NAME: Collapse
        PRODUCT_MODULE_NAME: Collapse
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: COLLAPSE
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/Collapse.entitlements
        TARGETED_DEVICE_FAMILY: 1
  CollapseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.collapse.game.widgets
        PRODUCT_NAME: CollapseWidgets
        PRODUCT_MODULE_NAME: CollapseWidgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: COLLAPSE
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  CollapseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Collapse
  CollapseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Collapse
schemes:
  Collapse:
    build:
      targets:
        Collapse: all
        CollapseWidgets: all
        CollapseTests: [test]
        CollapseUITests: [test]
    test:
      targets:
        - CollapseTests
        - CollapseUITests
